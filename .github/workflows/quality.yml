name: Quality Gates

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Stock module contract
        run: npm run stocks:contract:validate

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Data workflow dry run
        run: npm run data:workflow -- --workflow update --tickers v,now,anet,ma --dry-run
