<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Guru Intelligence by ThesisForge: evidence-first public-equity research, valuation, 13F intelligence, and portfolio analysis.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Guru Intelligence">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Guru Intelligence | ThesisForge</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script>
    // Remove legacy Flutter PWA caches once per migration, then keep the
    // current Flutter service worker warm on repeat visits.
    (() => {
      const currentUrl = new URL(window.location.href);
      const requestedView = (
        currentUrl.searchParams.get('view') ||
        currentUrl.searchParams.get('mode') ||
        ''
      ).toLowerCase();
      const isLegacyOntologyRoute =
        requestedView === 'ontology' ||
        window.location.pathname === '/dbmf' ||
        window.location.pathname.startsWith('/dbmf/');
      const isAuthCallback =
        currentUrl.searchParams.has('code') ||
        currentUrl.searchParams.has('error') ||
        window.location.hash.includes('access_token=');

      if (isLegacyOntologyRoute && !isAuthCallback) {
        const ontologyUrl = new URL('/ontology/', currentUrl);
        const language = currentUrl.searchParams.get('lang');
        if (language) ontologyUrl.searchParams.set('lang', language);
        window.location.replace(ontologyUrl.pathname + ontologyUrl.search);
        return;
      }

      const release = 'flutter-cache-migration-v2';
      const migrationKey = `guru-cache-migration:${release}`;
      const loadFlutter = () => {
        const script = document.createElement('script');
        script.src = `flutter_bootstrap.js?v=${release}`;
        script.async = true;
        document.body.appendChild(script);
      };

      const migrationComplete = () => {
        try {
          return window.localStorage.getItem(migrationKey) === 'complete';
        } catch (_) {
          return false;
        }
      };
      const markMigrationComplete = () => {
        try {
          window.localStorage.setItem(migrationKey, 'complete');
        } catch (_) {
          // Storage can be unavailable in privacy-restricted contexts.
        }
      };

      if (
        isAuthCallback ||
        !('serviceWorker' in navigator) ||
        migrationComplete()
      ) {
        loadFlutter();
        return;
      }

      Promise.all([
        navigator.serviceWorker.getRegistrations().then((registrations) =>
          Promise.all(registrations.map((registration) => registration.unregister())),
        ),
        'caches' in window
          ? caches.keys().then((keys) => Promise.all(keys.map((key) => caches.delete(key))))
          : Promise.resolve(),
      ]).then(() => {
        markMigrationComplete();
        if (navigator.serviceWorker.controller) {
          const url = new URL(window.location.href);
          url.searchParams.set('cache-migration', release);
          window.location.replace(url.toString());
          return;
        }
        loadFlutter();
      }).catch(loadFlutter);
    })();
  </script>
</body>
</html>
