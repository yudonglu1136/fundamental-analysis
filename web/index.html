<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Guru stock analysis executive terminal.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Guru Intelligence">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Guru Intelligence Executive Summary</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script>
    // Remove the legacy Flutter PWA cache used by earlier Guru releases.
    (() => {
      const release = 'ontology-cutover-v1';
      const loadFlutter = () => {
        const script = document.createElement('script');
        script.src = `flutter_bootstrap.js?v=${release}`;
        script.async = true;
        document.body.appendChild(script);
      };

      if (!('serviceWorker' in navigator)) {
        loadFlutter();
        return;
      }

      Promise.all([
        navigator.serviceWorker.getRegistrations().then((registrations) =>
          Promise.all(registrations.map((registration) => registration.unregister())),
        ),
        'caches' in window
          ? caches.keys().then((keys) => Promise.all(keys.map((key) => caches.delete(key))))
          : Promise.resolve(),
      ]).then(() => {
        if (
          navigator.serviceWorker.controller &&
          sessionStorage.getItem('guru-cache-release') !== release
        ) {
          sessionStorage.setItem('guru-cache-release', release);
          const url = new URL(window.location.href);
          url.searchParams.set('release', release);
          window.location.replace(url.toString());
          return;
        }
        loadFlutter();
      }).catch(loadFlutter);
    })();
  </script>
</body>
</html>
